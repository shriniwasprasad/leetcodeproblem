<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode Problems in Java</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e4e4e4;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 100%);
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 1.1rem;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #00d4ff;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #a0a0a0;
        }

        .search-box {
            margin-bottom: 30px;
        }

        .search-box input {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input::placeholder {
            color: #a0a0a0;
        }

        .search-box input:focus {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .section {
            margin-bottom: 15px;
            border-radius: 15px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }

        .section:hover {
            border-color: rgba(0, 212, 255, 0.3);
        }

        .section-header {
            padding: 20px 25px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }

        .section-header:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section-number {
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
        }

        .section-name {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .section-count {
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .toggle-icon {
            font-size: 1.5rem;
            color: #a0a0a0;
            transition: transform 0.3s;
        }

        .section.active .toggle-icon {
            transform: rotate(180deg);
        }

        .section-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
        }

        .section.active .section-content {
            max-height: 5000px;
        }

        .problem-card {
            padding: 20px 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            transition: background 0.3s;
        }

        .problem-card:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .problem-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .problem-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }

        .problem-title a {
            color: inherit;
            text-decoration: none;
            transition: color 0.3s;
        }

        .problem-title a:hover {
            color: #00d4ff;
        }

        .difficulty {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .difficulty.easy {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        .difficulty.medium {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }

        .difficulty.hard {
            background: rgba(255, 82, 82, 0.2);
            color: #ff5252;
        }

        .problem-description {
            color: #a0a0a0;
            font-size: 0.95rem;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .problem-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 8px;
        }

        .detail-label {
            font-size: 0.8rem;
            color: #a0a0a0;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 0.9rem;
            color: #e4e4e4;
            word-break: break-word;
        }

        .links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .link-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .link-btn.leetcode {
            background: rgba(255, 152, 0, 0.2);
            color: #ff9800;
        }

        .link-btn.leetcode:hover {
            background: rgba(255, 152, 0, 0.3);
        }

        .link-btn.video {
            background: rgba(255, 0, 0, 0.2);
            color: #ff5252;
        }

        .link-btn.video:hover {
            background: rgba(255, 0, 0, 0.3);
        }

        .link-btn.solution {
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
        }

        .link-btn.solution:hover {
            background: rgba(0, 212, 255, 0.3);
        }

        .link-btn.na {
            background: rgba(128, 128, 128, 0.2);
            color: #808080;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #a0a0a0;
            margin-top: 30px;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #a0a0a0;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .stats {
                gap: 20px;
            }

            .section-header {
                padding: 15px 20px;
            }

            .problem-card {
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>LeetCode Problems in Java</h1>
            <p class="subtitle">A comprehensive collection of 189 LeetCode problems solved in Java</p>
            <div class="stats">
                <div class="stat">
                    <div class="stat-number">189</div>
                    <div class="stat-label">Total Problems</div>
                </div>
                <div class="stat">
                    <div class="stat-number">18</div>
                    <div class="stat-label">Categories</div>
                </div>
                <div class="stat">
                    <div class="stat-number">3</div>
                    <div class="stat-label">Difficulty Levels</div>
                </div>
            </div>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search problems by name, description, or category...">
        </div>

        <div id="sectionsContainer"></div>

        <footer>
            <p>LeetCode Problems in Java &copy; 2026</p>
        </footer>
    </div>

    <script>
        const problemsData = [
            {
                section: "1. Array & Hashing",
                problems: [
                    { level: "Easy", title: "Best Time to Buy and Sell Stock", desc: "You are given an array of stock prices. Maximize profit by choosing a single day to buy and a different day in the future to sell.", input: "prices = {7, 1, 5, 3, 6, 4}", output: "5 (buy at 1, sell at 6)", complexity: "O(n)", leetcode: "https://leetcode.com/problems/best-time-to-buy-and-sell-stock/", video: "https://www.youtube.com/watch?v=CCQBvgPages" },
                    { level: "Easy", title: "Contains Duplicate", desc: "Given an integer array, return true if any value appears at least twice, false if every element is distinct.", input: "nums = {1, 2, 3, 1}", output: "true", complexity: "O(n)", leetcode: "https://leetcode.com/problems/contains-duplicate/", video: "https://www.youtube.com/watch?v=c_q_Pc2yg_0" },
                    { level: "Easy", title: "Contains Duplicate II", desc: "Given an integer array and integer k, return true if there are two distinct indices i and j where nums[i] == nums[j] and abs(i - j) <= k.", input: "nums = {1, 2, 3, 1}, k = 3", output: "true", complexity: "O(n)", leetcode: "https://leetcode.com/problems/contains-duplicate-ii/", video: "https://www.youtube.com/watch?v=Te_MCY4uG-M" },
                    { level: "Easy", title: "Two Sum", desc: "Given an array of integers and a target, return indices of two numbers that add up to target. Exactly one solution exists.", input: "nums = {2, 7, 11, 15}, target = 9", output: "{0, 1}", complexity: "O(n)", leetcode: "https://leetcode.com/problems/two-sum/", video: "https://www.youtube.com/watch?v=BQ2IJ-fouJ4" },
                    { level: "Easy", title: "Verifying an Alien Dictionary", desc: "Given an array of strings and a custom order, return true if strings are sorted lexicographically according to that order.", input: 'words = ["hello","leetcode"], order = "abcdefghijklmnopqrstuvwxyz"', output: "true", complexity: "O(n)", leetcode: "https://leetcode.com/problems/verifying-an-alien-dictionary/", video: "https://www.youtube.com/watch?v=8NoyVvm1v88" },
                    { level: "Medium", title: "Container With Most Water", desc: "Given n non-negative integers representing vertical lines, find two lines that with x-axis form a container holding the most water.", input: "height = {1, 8, 6, 2, 5, 4, 8, 3, 7}", output: "49", complexity: "O(n)", leetcode: "https://leetcode.com/problems/container-with-most-water/", video: "https://www.youtube.com/watch?v=wi8fqhNoV-Y" },
                    { level: "Medium", title: "Find First and Last Position of Element in Sorted Array", desc: "Given a sorted array and target value, find the starting and ending position of target.", input: "nums = {5, 7, 7, 8, 8, 10}, target = 8", output: "{3, 4}", complexity: "O(log n)", leetcode: "https://leetcode.com/problems/find-first-and-last-position-of-element-in-sorted-array/", video: "https://www.youtube.com/watch?v=aPD6g96fRO4" },
                    { level: "Medium", title: "Find Minimum in Rotated Sorted Array", desc: "Given a rotated sorted array with unique elements, return the minimum element.", input: "nums = {3, 4, 5, 1, 2}", output: "1", complexity: "O(log n)", leetcode: "https://leetcode.com/problems/find-minimum-in-rotated-sorted-array/", video: "https://www.youtube.com/watch?v=Dr69TSfv9JI" },
                    { level: "Medium", title: "Maximum Product Subarray", desc: "Given an integer array, find the subarray with the largest product and return the product.", input: "nums = {2, 3, -2, 4}", output: "6", complexity: "O(n)", leetcode: "https://leetcode.com/problems/maximum-product-subarray/", video: "https://www.youtube.com/watch?v=OuRQ_TCCjsU" },
                    { level: "Medium", title: "Maximum Subarray", desc: "Given an integer array, find the subarray with the largest sum and return its sum.", input: "nums = {-2, 1, -3, 4, -1, 2, 1, -5, 4}", output: "6", complexity: "O(n)", leetcode: "https://leetcode.com/problems/maximum-subarray/", video: "https://www.youtube.com/watch?v=nr2djEYM7_A" },
                    { level: "Medium", title: "3 Sum", desc: "Given an integer array, return all triplets such that they sum to zero.", input: "nums = {-1, 0, 1, 2, -1, -4}", output: "[[-1, -1, 2], [-1, 0, 1]]", complexity: "O(n²)", leetcode: "https://leetcode.com/problems/3-sum/", video: "https://www.youtube.com/watch?v=wtloSzFYvho" },
                    { level: "Medium", title: "Next Permutation", desc: "Given an array of integers, find the next permutation of the array in place.", input: "nums = {1, 2, 3}", output: "[1, 3, 2]", complexity: "O(n)", leetcode: "https://leetcode.com/problems/next-permutation/", video: "https://www.youtube.com/watch?v=oc3OOtGmH6U" },
                    { level: "Medium", title: "Product of Array Except Self", desc: "Given an integer array, return an array where answer[i] equals product of all elements except nums[i].", input: "nums = {1, 2, 3, 4}", output: "{24, 12, 8, 6}", complexity: "O(n)", leetcode: "https://leetcode.com/problems/product-of-array-except-self/", video: "https://www.youtube.com/watch?v=UxmLwxH-lhM" },
                    { level: "Medium", title: "Remove Duplicates from Sorted Array", desc: "Given a sorted array, remove duplicates in-place so each unique element appears only once.", input: "nums = {1, 1, 2}", output: "2", complexity: "O(n)", leetcode: "https://leetcode.com/problems/remove-duplicates-from-sorted-array/", video: "https://www.youtube.com/watch?v=0F49FLuzScU" },
                    { level: "Medium", title: "Search in Rotated Sorted Array", desc: "Given a rotated sorted array and target, return the index of target if present, or -1 if not.", input: "nums = {4, 5, 6, 7, 0, 1, 2}, target = 0", output: "4", complexity: "O(log n)", leetcode: "https://leetcode.com/problems/search-in-rotated-sorted-array/", video: "https://www.youtube.com/watch?v=sE_4DzVc71w" },
                    { level: "Medium", title: "Top K Frequent Elements", desc: "Given an integer array and integer k, return the k most frequent elements.", input: "nums = {1, 1, 1, 2, 2, 3}, k = 2", output: "{1, 2}", complexity: "O(n)", leetcode: "https://leetcode.com/problems/top-k-frequent-elements/", video: "https://www.youtube.com/watch?v=QubWUx59QCk" },
                    { level: "Medium", title: "Two Sum II - Input Array Is Sorted", desc: "Given a 1-indexed sorted array, find two numbers that add up to a target.", input: "nums = {2, 7, 11, 15}, target = 9", output: "[1, 2]", complexity: "O(n)", leetcode: "https://leetcode.com/problems/two-sum-ii-input-array-is-sorted/", video: "https://www.youtube.com/watch?v=c9ywRRJcP1Y" },
                    { level: "Medium", title: "Valid Sudoku", desc: "Determine if a 9x9 Sudoku board is valid.", input: "9x9 board", output: "true/false", complexity: "O(1)", leetcode: "https://leetcode.com/problems/valid-sudoku/", video: "https://www.youtube.com/watch?v=q2fl7lUkc8o" },
                    { level: "Hard", title: "Median of Two Sorted Arrays", desc: "Given two sorted arrays of size m and n, return the median of the two sorted arrays.", input: "nums1 = {1, 3}, nums2 = {2}", output: "2.0", complexity: "O(log(min(m,n)))", leetcode: "https://leetcode.com/problems/median-of-two-sorted-arrays/", video: "https://www.youtube.com/watch?v=LRM4qiHLYCE" },
                    { level: "Hard", title: "Trapping Rain Water", desc: "Given n non-negative integers representing elevation map, compute how much water can be trapped after raining.", input: "height = {0, 1, 0, 2, 1, 0, 1, 3, 2, 1, 2, 1}", output: "6", complexity: "O(n)", leetcode: "https://leetcode.com/problems/trapping-rain-water/", video: "https://www.youtube.com/watch?v=AFl_VxaO_F0" }
                ]
            },
            {
                section: "2. String",
                problems: [
                    { level: "Easy", title: "FizzBuzz", desc: "Given integer n, return FizzBuzz sequence.", input: "n = 15", output: '["1","2","Fizz","4","Buzz","Fizz","7","8","Fizz","Buzz","11","Fizz","13","14","FizzBuzz"]', complexity: "O(n)", leetcode: "https://leetcode.com/problems/fizz-buzz/", video: "https://www.youtube.com/watch?v=E3eO7jTFElU" },
                    { level: "Easy", title: "Is Subsequence", desc: "Given strings s and t, return true if s is a subsequence of t.", input: 's = "abc", t = "ahbgdc"', output: "true", complexity: "O(n)", leetcode: "https://leetcode.com/problems/is-subsequence/", video: "https://www.youtube.com/watch?v=I1yvLEkI6oo" },
                    { level: "Easy", title: "Longest Common Prefix", desc: "Find the longest common prefix string amongst an array of strings.", input: 'strs = ["flower","flow","flight"]', output: '"fl"', complexity: "O(n*m)", leetcode: "https://leetcode.com/problems/longest-common-prefix/", video: "https://www.youtube.com/watch?v=PWoIZxcamsQ" },
                    { level: "Easy", title: "Palindrome Linked List", desc: "Given head of singly linked list, return true if it reads the same forward and backward.", input: "head = [1,2,2,1]", output: "true", complexity: "O(n)", leetcode: "https://leetcode.com/problems/palindrome-linked-list/", video: "https://www.youtube.com/watch?v=uGGAJxeXa4U" },
                    { level: "Easy", title: "Remove Palindromic Subsequences", desc: "Given string of only 'a' and 'b', return minimum steps to make it empty.", input: 's = "ababa"', output: "1", complexity: "O(n)", leetcode: "https://leetcode.com/problems/remove-palindromic-subsequences/", video: "https://www.youtube.com/watch?v=nP7FfNO0bj8c" },
                    { level: "Easy", title: "Reverse Vowels of a String", desc: "Reverse only the vowels in a string.", input: 's = "hello"', output: '"holle"', complexity: "O(n)", leetcode: "https://leetcode.com/problems/reverse-vowels-of-a-string/", video: "https://www.youtube.com/watch?v=bjKt6xj9VgM" },
                    { level: "Easy", title: "Valid Anagram", desc: "Given two strings s and t, return true if t is an anagram of s.", input: 's = "anagram", t = "nagaram"', output: "true", complexity: "O(n)", leetcode: "https://leetcode.com/problems/valid-anagram/", video: "https://www.youtube.com/watch?v=qyQni3rz-ko" },
                    { level: "Easy", title: "Valid Palindrome", desc: "A phrase is palindrome if after converting to lowercase and removing non-alphanumeric.", input: 's = "A man, a plan, a canal: Panama"', output: "true", complexity: "O(n)", leetcode: "https://leetcode.com/problems/valid-palindrome/", video: "https://www.youtube.com/watch?v=MFPmKyThyHk" },
                    { level: "Easy", title: "Valid Parentheses", desc: "Given string with '(', ')', '{', '}', '[', ']', determine if valid.", input: 's = "([{}])"', output: "true", complexity: "O(n)", leetcode: "https://leetcode.com/problems/valid-parentheses/", video: "https://www.youtube.com/watch?v=D4l9TK0tWcI" },
                    { level: "Medium", title: "Encode and Decode Strings", desc: "Design algorithms to encode a list of strings to a string and decode it back.", input: '["Hello", "World"]', output: '["Hello", "World"]', complexity: "O(n)", leetcode: "https://leetcode.com/problems/encode-and-decode-strings/", video: "https://www.youtube.com/watch?v=P5LQbpI4p_I" },
                    { level: "Medium", title: "Group Anagrams", desc: "Given an array of strings, group the anagrams together.", input: 'strs = ["eat","tea","tan","ate","nat","bat"]', output: '[["bat"],["nat","tan"],["ate","eat","tea"]]', complexity: "O(n*k log k)", leetcode: "https://leetcode.com/problems/group-anagrams/", video: "https://www.youtube.com/watch?v=dEMcIpBOHpg" },
                    { level: "Medium", title: "Letter Combinations of a Phone Number", desc: "Given digits 2-9, return all possible letter combinations.", input: 'digits = "23"', output: '["ad","ae","af","bd","be","bf","cd","ce","cf"]', complexity: "O(4^n)", leetcode: "https://leetcode.com/problems/letter-combinations-of-a-phone-number/", video: "https://www.youtube.com/watch?v=dmYiOfy8a-k" },
                    { level: "Medium", title: "Longest Palindromic Substring", desc: "Given a string, find the longest substring that is a palindrome.", input: 's = "babad"', output: '"bab" or "aba"', complexity: "O(n²)", leetcode: "https://leetcode.com/problems/longest-palindromic-substring/", video: "https://www.youtube.com/watch?v=92KOT17h8zw" },
                    { level: "Medium", title: "Longest Repeating Character Replacement", desc: "Given string s and integer k, change any character at most k times.", input: 's = "ABAB", k = 2', output: "4", complexity: "O(n)", leetcode: "https://leetcode.com/problems/longest-repeating-character-replacement/", video: "https://www.youtube.com/watch?v=FYyWsqFjkZk" },
                    { level: "Medium", title: "Longest Substring Without Repeating Characters", desc: "Find length of longest substring without repeating characters.", input: 's = "abcabcbb"', output: "3", complexity: "O(n)", leetcode: "https://leetcode.com/problems/longest-substring-without-repeating-characters/", video: "https://www.youtube.com/watch?v=RMQ-gRQAY0o" },
                    { level: "Medium", title: "Palindromic Substrings", desc: "Given a string, return the total number of palindromic substrings.", input: 's = "aaa"', output: "6", complexity: "O(n²)", leetcode: "https://leetcode.com/problems/palindromic-substrings/", video: "https://www.youtube.com/watch?v=WfkVe8egZbU" },
                    { level: "Medium", title: "Permutation In String", desc: "Given two strings s1 and s2, return true if s2 contains a permutation of s1.", input: 's1 = "ab", s2 = "eidbaooo"', output: "true", complexity: "O(n)", leetcode: "https://leetcode.com/problems/permutation-in-string/", video: "https://www.youtube.com/watch?v=mIorIJvhl8E" },
                    { level: "Medium", title: "Reverse Words in a String", desc: "Reverse the order of words in a string.", input: 's = "the sky is blue"', output: '"blue is sky the"', complexity: "O(n)", leetcode: "https://leetcode.com/problems/reverse-words-in-a-string/", video: "https://www.youtube.com/watch?v=WfkVe8egZbU" },

                "16. Interval": { category: "interval", level: "easy" },
                "17. Matrix": { category: "matrix", level: "easy" },
                "18. Greedy": { category: "greedy", level: "medium" }
            };

            const levelMap = {
                "Easy": "easy",
                "Medium": "medium",
                "Hard": "hard"
            };

            const mapped = sectionMap[sectionName] || { category: "unknown", level: "easy" };
            const problemLevel = levelMap[problem.level] || "easy";
            const fileName = problem.title.replace(/[^a-zA-Z0-9]/g, '');
            const solutionLink = `src/main/java/org/example/problems/${mapped.category}/${problemLevel}/${fileName}.java`;

            return `
                <div class="problem-card">
                    <div class="problem-header">
                        <span class="problem-title">
                            <a href="${problem.leetcode}" target="_blank">${index + 1}. ${problem.title}</a>
                        </span>
                        <span class="difficulty ${problem.level.toLowerCase()}">${problem.level}</span>
                    </div>
                    <p class="problem-description">${problem.desc}</p>
                    <div class="problem-details">
                        <div class="detail-item">
                            <div class="detail-label">Input</div>
                            <div class="detail-value">${problem.input}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Output</div>
                            <div class="detail-value">${problem.output}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Complexity</div>
                            <div class="detail-value">${problem.complexity}</div>
                        </div>
                    </div>
                    <div class="links">
                        <a href="${solutionLink}" target="_blank" class="link-btn solution">💻 Solution</a>
                        <a href="${problem.leetcode}" target="_blank" class="link-btn leetcode">🔥 LeetCode</a>
                        ${videoLink}
                    </div>
                </div>
            `;
        }

        function createSection(sectionData, index) {
            const sectionNum = index + 1;
            return `
                <div class="section" data-section="${sectionData.section}">
                    <div class="section-header" onclick="toggleSection(this)">
                        <div class="section-title">
                            <span class="section-number">${sectionNum}</span>
                            <span class="section-name">${sectionData.section}</span>
                        </div>
                        <div class="section-info">
                            <span class="section-count">${sectionData.problems.length} problems</span>
                            <span class="toggle-icon">▼</span>
                        </div>
                    </div>
                    <div class="section-content">
                        ${sectionData.problems.map((problem, i) => createProblemCard(problem, i, sectionData.section)).join('')}
                    </div>
                </div>
            `;
        }

        function renderSections(data) {
            const container = document.getElementById('sectionsContainer');
            container.innerHTML = data.map((section, i) => createSection(section, i)).join('');
        }

        function toggleSection(header) {
            const section = header.parentElement;
            section.classList.toggle('active');
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const sections = document.querySelectorAll('.section');

            sections.forEach(section => {
                const sectionName = section.dataset.section.toLowerCase();
                const problems = section.querySelectorAll('.problem-card');
                let hasMatch = sectionName.includes(searchTerm);

                problems.forEach(problem => {
                    const title = problem.querySelector('.problem-title').textContent.toLowerCase();
                    const desc = problem.querySelector('.problem-description').textContent.toLowerCase();
                    const match = title.includes(searchTerm) || desc.includes(searchTerm);

                    problem.style.display = match ? 'block' : 'none';
                    if (match) hasMatch = true;
                });

                section.style.display = hasMatch ? 'block' : 'none';
            });
        });

        // Initial render
        renderSections(problemsData);
    </script>
</body>
</html>
