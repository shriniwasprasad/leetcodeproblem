                    solution: "package string.easy;\n\nimport java.util.*;\n\n/**\n * Problem: Fizz Buzz\n * Topic: String\n * Level: Easy\n * \n * Problem Description:\n * Given an integer n, return a list of strings representing the FizzBuzz sequence from 1 to n.\n * - For numbers divisible by 3, output \"Fizz\"\n * - For numbers divisible by 5, output \"Buzz\"\n * - For numbers divisible by both 3 and 5, output \"FizzBuzz\"\n * - For all other numbers, output the number itself as a string\n * \n * Hint: Check divisibility by 15 (both 3 and 5) first, or build the string by appending \"Fizz\" and \"Buzz\".\n * \n * Example:\n * Input: n = 15\n * Expected Output: [\"1\",\"2\",\"Fizz\",\"4\",\"Buzz\",\"Fizz\",\"7\",\"8\",\"Fizz\",\"Buzz\",\"11\",\"Fizz\",\"13\",\"14\",\"FizzBuzz\"]\n * \n * Constraints:\n * - 1 <= n <= 10^4\n * \n * Video Explanation: https://www.youtube.com/watch?v=E3eO7jTFElU\n * LeetCode Problem Link: https://leetcode.com/problems/fizz-buzz/\n */\npublic class FizzBuzz {\n\n    public static void main(String[] args) {\n        System.out.println(\"=== FizzBuzz ===\");\n        \n        List<String> result = (List<String>) solution(15);\n        System.out.println(\"Solution (n=15): \" + result);\n    }\n\n    public static Object solution(Object input) {\n        int n = (Integer) input;\n        List<String> result = new ArrayList<>();\n        \n        for (int i = 1; i <= n; i++) {\n            if (i % 15 == 0) result.add(\"FizzBuzz\");\n            else if (i % 3 == 0) result.add(\"Fizz\");\n            else if (i % 5 == 0) result.add(\"Buzz\");\n            else result.add(String.valueOf(i));\n        }\n        return result;\n    }\n}"

                    leetcode: "https://leetcode.com/problems/minimum-window-substring/",
                    video: "https://www.youtube.com/watch?v=tMx5JZSBWIE",
                    solution: "package org.example.problems.string.hard;\n\nimport java.util.*;\n\npublic class MinimumWindowSubstring {\n    public static String solution(String s, String t) {\n        if (s.length() < t.length()) return \"\";\n        Map<Character, Integer> req = new HashMap<>();\n        for (char c : t.toCharArray()) req.put(c, req.getOrDefault(c, 0) + 1);\n        Map<Character, Integer> window = new HashMap<>();\n        int left = 0, minLen = Integer.MAX_VALUE, minStart = 0, formed = 0;\n        for (int right = 0; right < s.length(); right++) {\n            char c = s.charAt(right);\n            window.put(c, window.getOrDefault(c, 0) + 1);\n            if (req.containsKey(c) && window.get(c).equals(req.get(c))) formed++;\n            while (left <= right && formed == req.size()) {\n                if (right - left + 1 < minLen) { minLen = right - left + 1; minStart = left; }\n                char lChar = s.charAt(left++);\n                window.put(lChar, window.get(lChar) - 1);\n                if (req.containsKey(lChar) && window.get(lChar) < req.get(lChar)) formed--;\n            }\n        }\n        return minLen == Integer.MAX_VALUE ? \"\" : s.substring(minStart, minStart + minLen);\n    }\n}"
                },
                {
                    title: "Text Justification",
                    description: "Format text such that each line has exactly maxWidth characters and is fully justified.",
                    hint: "Greedily pack words, then distribute spaces evenly. Last line is left-justified.",
                    examples: "Input: words = [\"This\", \"is\", \"an\"...], maxWidth = 16\nOutput: [\"This    is    an\", ...]",
                    leetcode: "https://leetcode.com/problems/text-justification/",
                    video: "https://www.youtube.com/watch?v=Pf_1Ox9ud_w",
                    solution: "package org.example.problems.string.hard;\n\nimport java.util.*;\n\npublic class TextJustification {\n    public static List<String> solution(String[] words, int maxWidth) {\n        List<String> res = new ArrayList<>();\n        int i = 0;\n        while (i < words.length) {\n            List<String> line = new ArrayList<>();\n            int lineLen = 0;\n            while (i < words.length && lineLen + words[i].length() + line.size() <= maxWidth) {\n                line.add(words[i++]);\n                lineLen += words[i-1].length();\n            }\n            res.add(justify(line, lineLen, maxWidth, i == words.length));\n        }\n        return res;\n    }\n    private static String justify(List<String> line, int len, int width, boolean last) {\n        StringBuilder sb = new StringBuilder();\n        int spaces = width - len;\n        int gaps = line.size() - 1;\n        if (last || gaps == 0) {\n            for (int j = 0; j < line.size(); j++) {\n                sb.append(line.get(j)).append(j < gaps ? \" \" : \"\");\n            }\n            while (sb.length() < width) sb.append(\" \");\n        } else {\n            int perGap = spaces / gaps, extra = spaces % gaps;\n            for (int j = 0; j < line.size(); j++) {\n                sb.append(line.get(j));\n                if (j < gaps) sb.append(\" \".repeat(perGap + (j < extra ? 1 : 0)));\n            }\n        }\n        return sb.toString();\n    }\n}"
                }
            ]
        };

        let cachedData = {
            string: stringData
        };

        async function initNav() {
            const nav = document.getElementById('nav-links');
            sections.forEach(s => {
                const btn = document.createElement('button');
                btn.innerText = s.charAt(0).toUpperCase() + s.slice(1);
                btn.className = `px-4 py-2 rounded-lg transition-all text-sm font-medium ${s === currentSection ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/30' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`;
                btn.onclick = () => showSection(s);
                nav.appendChild(btn);
            });
        }

        async function showSection(section) {
            currentSection = section;
            currentFilter = 'all';
            document.getElementById('section-title').innerText = section.charAt(0).toUpperCase() + section.slice(1) + " Problems";

            document.querySelectorAll('nav button').forEach(btn => {
                btn.className = `px-4 py-2 rounded-lg transition-all text-sm font-medium ${btn.innerText.toLowerCase() === section ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/30' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`;
            });

            await fetchProblems();
        }

        async function fetchProblems() {
            const grid = document.getElementById('problems-grid');
            grid.innerHTML = '<div class="col-span-full text-center py-20 text-slate-500"><i class="fas fa-circle-notch fa-spin text-3xl mb-4 block"></i> Loading problems...</div>';

            try {
                const response = await fetch(`/api/problems?section=${currentSection}`);
                const data = await response.json();
                cachedData[currentSection] = data;
                renderProblems();
            } catch (e) {
                grid.innerHTML = '<div class="col-span-full text-center py-20 text-red-400">Error loading data. Ensure server is running.</div>';
            }
        }

        function filterDifficulty(diff) {
            currentFilter = diff;
            renderProblems();
        }

        async function openSolution(title, filePath) {
            try {
                const response = await fetch(`/api/file?path=${encodeURIComponent(filePath)}`);
                if (!response.ok) throw new Error('File not found');
                const code = await response.text();

                document.getElementById('modalTitle').innerText = title;
                document.getElementById('modalCode').innerText = code;
                const modal = document.getElementById('solutionModal');
                modal.style.display = 'flex';
            } catch (e) {
                alert('Error loading solution: ' + e.message);
            }
        }

        function closeModal() {
            document.getElementById('solutionModal').style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target == document.getElementById('solutionModal')) {
                closeModal();
            }
        }

        function renderProblems() {
            const grid = document.getElementById('problems-grid');
            grid.innerHTML = '';

            const sectionData = cachedData[currentSection] || {};
            const diffs = ['easy', 'medium', 'hard'];
            diffs.forEach(diff => {
                if (currentFilter !== 'all' && currentFilter !== diff) return;
                const problems = sectionData[diff] || [];
                problems.forEach((prob) => {
                    const diffColor = diff === 'easy' ? 'text-green-400 bg-green-400/10 border-green-500/20' :
                                     diff === 'medium' ? 'text-yellow-400 bg-yellow-400/10 border-yellow-500/20' : 'text-red-400 bg-red-400/10 border-red-500/20';

                    const card = document.createElement('div');
                    card.className = 'problem-card bg-slate-800/50 backdrop-blur-sm rounded-3xl border border-slate-700 p-6 flex flex-col h-full';

                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-xl font-bold text-white tracking-tight">${prob.title || 'Untitled'}</h3>
                            <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase border ${diffColor}">${diff}</span>
                        </div>

                        <div class="mb-6">
                            <h4 class="text-[10px] font-bold uppercase text-slate-500 mb-2 tracking-widest">Description</h4>
                            <p class="text-slate-300 text-sm leading-relaxed">${prob.description || 'No description available.'}</p>
                        </div>

                        <div class="mb-6 p-4 rounded-2xl bg-indigo-500/5 border border-indigo-500/10">
                            <h4 class="text-[10px] font-bold uppercase text-indigo-400 mb-2 tracking-widest flex items-center gap-2">
                                <i class="fas fa-lightbulb"></i> Hint
                            </h4>
                            <p class="text-slate-400 text-sm italic leading-relaxed">${prob.hint || 'No hint available.'}</p>
                        </div>

                        <div class="mb-8">
                            <h4 class="text-[10px] font-bold uppercase text-slate-500 mb-2 tracking-widest">Sample Case</h4>
                            <div class="bg-slate-950 p-4 rounded-2xl font-mono text-xs text-indigo-300 border border-slate-800 whitespace-pre overflow-x-auto leading-relaxed">
                                ${prob.examples || 'No sample input available.'}
                            </div>
                        </div>

                        <div class="mt-auto flex items-center gap-3">
                            ${prob.leetcode ? `<a href="${prob.leetcode}" target="_blank" class="flex-1 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold transition-all flex items-center justify-center gap-2"><i class="fab fa-leetcode"></i> LeetCode</a>` : ''}
                            ${prob.video ? `<a href="${prob.video}" target="_blank" class="flex-1 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold transition-all flex items-center justify-center gap-2"><i class="fab fa-youtube"></i> Video</a>` : ''}
                            <button onclick="openSolution('${prob.title}', \`${prob.filePath}\`)" class="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition-all shadow-lg shadow-indigo-500/20 flex items-center justify-center gap-2">
                                <i class="fas fa-code"></i> Solution
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            });
        }

        initNav();
        showSection('string');
    </script>
</body>
</html>
